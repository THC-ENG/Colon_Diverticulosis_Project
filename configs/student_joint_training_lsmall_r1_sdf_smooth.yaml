# A/B test config: L_small GT + manually approved round1 pseudo only.
mode: student_with_pseudo_distill
data_manifest: runs/flywheel_full_manual_bridge_1500/student_manifest_lsmall_r1_sdf_smooth.csv
data_root: data/joint_polyp_v1
manifest_mode: only
mask_threshold: 127
val_ratio: 0.2
train_pseudo_max_ratio: -1.0
train_pseudo_max_count: 0
use_domain_aware_sampler: true
source_balance_power: 0.5
polypgen_source_boost: 1.3
labeled_sample_factor: 1.4
pseudo_sample_factor: 0.45
tier_mid_sample_factor: 0.45
tier_high_sample_factor: 0.75
epochs: 100
batch_size: 4
lr: 0.0001
encoder_lr_mult: 0.1
weight_decay: 0.0001
warmup_epochs: 5
grad_clip_norm: 1.0
num_workers: 2
img_size: 256
seed: 42
save_path: runs/flywheel_full_manual_bridge_1500/checkpoints/student_lsmall_r1_sdf_smooth.pth
init_checkpoint: ''
run_name: student_lsmall_r1_sdf_smooth
device: cuda
amp: true
norm_type: gn
window_size: 8
use_shift_mask: true
use_rel_pos_bias: true
pad_to_window: true
use_wavelet_bottleneck: true
deep_supervision: true
ds_weight_d2: 0.4
ds_weight_d3: 0.2
ds_weight_d4: 0.1
seg_focal_weight: 0.7
seg_dice_weight: 0.3
focal_alpha: 0.25
focal_gamma: 2.0
use_edge_consistency: true
use_distill: true
distill_signals: softmask,edge
distill_temperature: 2.0
lambda_sup: 1.0
lambda_pseudo: 0.08
lambda_edge: 0.06
lambda_distill: 0.0
schedule_milestones: 0.35,0.85,0.97
boundary_band_radius: 3
pseudo_boundary_band_weight: 0.15
gt_boundary_band_boost: 1.35
pseudo_edge_scale: 0.25
gt_edge_scale: 1.4
use_boundary: false
use_boundary_head: false
boundary_radius: 1
boundary_weight: 0.3
boundary_bce_weight: 1.0
boundary_dice_weight: 0.0
polypgen_aug_prob: 0.6
polypgen_h_shift_max: 10
polypgen_sat_scale_min: 0.75
polypgen_sat_scale_max: 1.35
polypgen_val_scale_min: 0.8
polypgen_val_scale_max: 1.25
polypgen_gamma_min: 0.8
polypgen_gamma_max: 1.3
polypgen_clahe_prob: 0.5
